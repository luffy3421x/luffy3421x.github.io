    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">RESTAURANTE CIELO</a>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="menu.html">Entradas</a></li>
                <li><a href="platos-fuertes.html">Platos Fuertes</a></li>

                <li><a href="reservas.html" class="active">Reservas</a></li>

            </ul>
        </nav>
    </header>

    <main class="container">
        <h2 class="section-title">Reserva tu Mesa</h2>
        <p class="section-subtitle">Asegura tu lugar para una velada extraordinaria</p>

        <div class="form-container">
            <form action="#">
                <div class="form-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" class="form-control" placeholder="Tu nombre" required>
                </div>
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" class="form-control" placeholder="correo@ejemplo.com" required>
                </div>
                <div class="form-group">
                    <label for="fecha">Fecha y Hora</label>
                    <input type="datetime-local" id="fecha" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="personas">Número de Personas</label>
                    <input type="number" id="personas" class="form-control" min="1" max="12" value="2" required>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Confirmar Reserva</button>
            </form>
        </div>
    </main>

    <footer><p>&copy; 2026 Restaurante Cielo. Todos los derechos reservados.</p></footer>
